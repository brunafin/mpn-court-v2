name: test

on:
  push:
    branches: [sandbox]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Checkout cruzado: o secret E2E_API_TOKEN precisa de leitura em brunafin/mpn-api-v2.
  e2e:
    if: ${{ secrets.E2E_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mpn_e2e
          POSTGRES_PASSWORD: mpn_e2e
          POSTGRES_DB: mpn_e2e
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mpn_e2e -d mpn_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Sao_Paulo
      CI: "true"
      E2E_API_DIR: e2e-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brunafin/mpn-api-v2
          ref: sandbox
          path: e2e-api
          token: ${{ secrets.E2E_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e-api/package-lock.json
      - run: npm ci
        working-directory: e2e-api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
